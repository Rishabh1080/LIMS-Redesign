<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shipping Label</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

@page{
    size:100mm 150mm;
    margin:0;
}

html,body{
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

.label{

    width:100mm;
    height:150mm;

    box-sizing:border-box;

    padding:6mm;

    border:1px solid #000;

}

h1{

    margin:0;
    font-size:26px;

}

table{

    width:100%;
    border-collapse:collapse;
    margin-top:8mm;

}

td{

    padding:3px 0;
    font-size:16px;

}

.barcode{

    margin-top:10mm;
    text-align:center;

}

.footer{

    margin-top:8mm;
    font-size:14px;
    text-align:center;

}

button{

    margin:20px;

    padding:10px 20px;

    font-size:16px;

}

@media print{

button{

display:none;

}

}

</style>

</head>

<body>

<button onclick="window.print()">
Print Label
</button>

<style>
    * {
      box-sizing: border-box;
    }
 
    body {
      margin: 0;
      background: #eee;
      font-family: Inter, Arial, Helvetica, sans-serif;
    }
 
    .label {
      position: relative;
      width: 300px;
      height: 150px;
      background: #fff;
      border: 1px solid #000;
      overflow: hidden;
    }
 
    .header {
      position: absolute;
      left: 0;
      top: 0;
      width: 300px;
      height: 34px;
      border-bottom: 1px solid #000;
    }
 
    .logo {
      position: absolute;
      left: 6px;
      top: 8px;
      width: 53px;
      height: 17px;
      object-fit: contain;
    }
 
    .company {
      position: absolute;
      left: 77px;
      top: 8px;
      font-size: 14px;
      line-height: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
 
    .content {
      position: absolute;
      left: 6px;
      top: 42px;
      width: 287px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
 
    .row {
      display: flex;
      align-items: flex-end;
      width: 100%;
      height: 13px;
    }
 
    .pair {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
    }
 
    .label-text {
      font-size: 9px;
      line-height: 12px;
      font-weight: 500;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
 
    .value-text {
      font-size: 10px;
      line-height: 13px;
      font-weight: 700;
      letter-spacing: -0.03em;
      white-space: nowrap;
    }
 
    .barcode-wrap {
      position: absolute;
      left: 0;
      right: 0;
      top: 112px;
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
 
    #barcode {
      display: block;
    }
</style>
</head>
 
<body>
<div class="label">
<div class="header">
<img
        class="logo"
        alt="Veedol Logo"
        src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MyIgaGVpZ2h0PSIxNyIgdmlld0JveD0iMCAwIDUzIDE3Ij4KPHJlY3QgeD0iLjUiIHk9Ii41IiB3aWR0aD0iNTIiIGhlaWdodD0iMTYiIHJ4PSIyIiBmaWxsPSIjZmZmIiBzdHJva2U9IiMwMDAiLz4KPHJlY3QgeD0iMCIgeT0iMCIgd2lkdGg9IjIxIiBoZWlnaHQ9IjE3IiByeD0iMiIgZmlsbD0iIzAwMCIvPgo8ZyBmaWxsPSIjZmZmIj4KPHBhdGggZD0iTTQgNWg4bDEuNSAzaC03eiIvPgo8cGF0aCBkPSJNNCA4aDkuNUwxMiAxMUg2eiIvPgo8cGF0aCBkPSJNMjAgNWgtN2wtMS41IDNIMTh6Ii8+CjxwYXRoIGQ9Ik0yMCA4aC04LjVsMS41IDNoNXoiLz4KPHBhdGggZD0iTTggNGg3bC0zIDl6Ii8+CjwvZz4KPHRleHQgeD0iMjMiIHk9IjEyIiBmb250LWZhbWlseT0iQXJpYWwsc2Fucy1zZXJpZiIgZm9udC1zaXplPSI4LjgiIGZvbnQtd2VpZ2h0PSI3MDAiIGZpbGw9IiMwMDAiPlZlZWRvbDwvdGV4dD4KPC9zdmc+"
      />
 
      <div class="company">Veedol Corporation Limited</div>
</div>
 
    <div class="content">
<div class="row">
<div class="pair">
<span class="label-text">Product Name:</span>
<span class="value-text">Kubota New Diesel Engine Oil</span>
</div>
</div>
 
      <div class="row">
<div class="pair">
<span class="label-text">Batch No:</span>
<span class="value-text">F/03/2026- FA</span>
</div>
 
        <div class="pair">
<span class="label-text">Sample ID:</span>
<span class="value-text">FP-F/002912</span>
</div>
</div>
 
      <div class="row">
<div class="pair">
<span class="label-text">Manufactured On:</span>
<span class="value-text">01/07/2026</span>
</div>
 
        <div class="pair">
<span class="label-text">Tested On:</span>
<span class="value-text">09/07/2026</span>

    <div class="barcode-wrap">
<svg id="barcode"></svg>
</div>
</div>
 
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
    JsBarcode("#barcode", "123456789012", {
      format: "CODE128",
      width: 1,
      height: 18,
      displayValue: true,
      fontSize: 8,
      textMargin: 1,
      margin: 0,
      background: "#ffffff",
      lineColor: "#000000"
    });
</script>


</body>
</html>
